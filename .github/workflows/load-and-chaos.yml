name: Scale Stage 3 — Scheduled Load & Chaos Verification

on:
  schedule:
    # Weekly Monday 03:00 UTC automated chaos, resilience & spike verification
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      load_profile:
        description: 'k6 load profile (baseline | soak | 3x_spike)'
        required: false
        default: '3x_spike'
        type: choice
        options:
          - baseline
          - soak
          - 3x_spike

permissions:
  contents: read

jobs:
  chaos-and-resilience-drills:
    name: Chaos Drills, Partitioning & Adaptive Load Shedding
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: aml_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations through 040 (Partitioning & Async Jobs)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: aml_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          OUTBOUND_EGRESS_ENABLED: "false"
        run: alembic upgrade head

      - name: Execute Stage 1, 2 & 3 Resilience + Chaos Test Suites
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: aml_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          OUTBOUND_EGRESS_ENABLED: "false"
          FINCEN_SANDBOX_MODE: "true"
        run: |
          pytest tests/test_scale_stage1_readiness.py \
                 tests/test_scale_stage2_readiness.py \
                 tests/test_scale_stage3_readiness.py -v

      - name: Execute DR Failover & Partition Maintenance Dry-Run
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: aml_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          OUTBOUND_EGRESS_ENABLED: "false"
        run: |
          python scripts/maintain_partitions.py
          python scripts/dr_failover_drill.py

  k6-spike-verification:
    name: k6 3x Spike & SLO Verification
    runs-on: ubuntu-latest
    needs: chaos-and-resilience-drills
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate k6 Load Script Syntax & SLO Thresholds
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("load_test_k6.js", "utf8");
            for (const req of ["3x_spike", "soak", "p(95)<300", "p(99)<750", "p0_unexpected_5xx", "Idempotency-Key"]) {
              if (!src.includes(req)) throw new Error("Missing required k6 Stage 3 directive: " + req);
            }
            console.log("k6 Stage 3 load profile & SLO assertions validated.");
          '
