name: Enterprise AML CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# P1-11: Minimal default permissions at workflow root (write scoped per job)
permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Code Quality, SAST, Secrets & Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Kubernetes Manifest Validation (Kubeconform with SHA-256 verification)
        run: |
          KUBECONFORM_VER="0.6.7"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VER}/kubeconform-linux-amd64.tar.gz"
          CHECKSUMS_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VER}/CHECKSUMS"
          curl -fsSL "${KUBECONFORM_URL}" -o /tmp/kubeconform.tar.gz
          curl -fsSL "${CHECKSUMS_URL}" -o /tmp/CHECKSUMS
          EXPECTED_SHA=$(grep "kubeconform-linux-amd64.tar.gz" /tmp/CHECKSUMS | awk '{print $1}')
          echo "${EXPECTED_SHA}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          rm -f /tmp/kubeconform.tar.gz /tmp/CHECKSUMS
          kubeconform -summary -ignore-missing-schemas -skip ExternalSecret deployments/kubernetes/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Lint Check (Ruff)
        run: |
          ruff check .

      - name: Python Security SAST (Bandit — Full Codebase)
        run: |
          bandit -r main.py config.py routers services database workers observability scripts -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Frontend Dependency Audit & JS Syntax Check
        run: |
          if [ -f package-lock.json ]; then
            npm audit --omit=dev --audit-level=high
          fi
          node --check static/api-client.js static/sentinel-query.js static/sentinel-shell.js static/app.js

  test:
    name: Run Alembic Migrations & Compliance Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify OpenAPI & TypeScript API Contracts (Zero Drift Gate)
        env:
          OUTBOUND_EGRESS_ENABLED: "false"
        run: |
          python scripts/export_openapi_contract.py --check

      - name: Run Alembic Database Migrations
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
          AML_APP_PASSWORD: aml_app_password_test_2026
        run: |
          alembic upgrade head

      - name: Run Test Suite with Mandatory 70% Coverage Gate
        env:
          ENVIRONMENT: test
          ENABLE_TLS: "false"
          STRICT_MTLS: "false"
          RUN_EMBEDDED_WORKER: "false"
          OUTBOUND_EGRESS_ENABLED: "false"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AML_APP_PASSWORD: aml_app_password_test_2026
        run: |
          pytest --cov=routers --cov=services --cov-fail-under=70 tests/ -v

  container-security:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image & Verify Zero Secret/Venv/DevScript Leakage
        run: |
          docker build -t aml-system:ci-scan .
          docker run --rm aml-system:ci-scan sh -c 'test ! -f /app/.env && test ! -d /app/.venv && test ! -f /app/scripts/init_db.py && test ! -f /app/scripts/repair_local_audit_chain.py && python -c "import xgboost, asyncpg"'

      - name: Scan Image with Trivy (Pinned Release, Fail on HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aml-system:ci-scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  deploy:
    name: Continuous Deployment (GHCR Push & Gated Zero-Downtime K8s Rollout)
    runs-on: ubuntu-latest
    needs: [container-security]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    # P1-11: Mandatory GitHub environment protection & approval gate
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Immutable SHA Image to GHCR (no mutable :latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.10"

      - name: Run Migrations & Roll Out API + All Worker Deployments
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_URI: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          if [ -n "${KUBECONFIG_DATA:-}" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "${KUBECONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"

            # 1. Run Alembic pre-rollout migration Job to completion
            kubectl delete job aml-alembic-migration -n aml-system --ignore-not-found
            sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" deployments/kubernetes/alembic-migration-job.yaml | kubectl apply -f -
            kubectl wait --for=condition=complete job/aml-alembic-migration -n aml-system --timeout=300s

            # 2. Update API + ALL worker deployments atomically (no version skew, no '|| true')
            kubectl set image deployment/aml-fastapi-app fastapi-app="${IMAGE_URI}" -n aml-system
            kubectl set image deployment/aml-outbox-relay outbox-relay="${IMAGE_URI}" -n aml-system
            kubectl set image deployment/aml-scoring-worker scoring-worker="${IMAGE_URI}" -n aml-system
            if kubectl get deployment/aml-sync-worker -n aml-system >/dev/null 2>&1; then
              kubectl set image deployment/aml-sync-worker sync-worker="${IMAGE_URI}" -n aml-system
            fi

            kubectl rollout status deployment/aml-fastapi-app -n aml-system --timeout=180s
            kubectl rollout status deployment/aml-outbox-relay -n aml-system --timeout=180s
            kubectl rollout status deployment/aml-scoring-worker -n aml-system --timeout=180s
          else
            echo "KUBECONFIG_DATA not configured; validated immutable image ${IMAGE_URI}."
          fi
