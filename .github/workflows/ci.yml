name: Enterprise AML CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security SAST Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Lint Codebase (Ruff)
        run: |
          ruff check .

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-2023-45803

  test:
    name: Run Unit, Integration & Compliance Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pyyaml

      - name: Run Test Suite with Coverage
        env:
          ENABLE_TLS: "false"
          STRICT_MTLS: "false"
          RUN_EMBEDDED_WORKER: "false"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AML_APP_PASSWORD: aml_app_password_test_2026
        run: |
          pytest --cov=routers --cov=services tests/ -v

  container-security:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: aml-system:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aml-system:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

  deploy:
    name: Continuous Deployment (Kubernetes Rollout)
    runs-on: ubuntu-latest
    needs: [container-security]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Tag Immutable Image
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          echo "Building image tagged with ${IMAGE_TAG} and latest"
          docker build -t aml-fastapi-app:${IMAGE_TAG} -t aml-fastapi-app:latest .

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Deploy to Kubernetes Cluster
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          echo "Updating Kubernetes deployment with image tag ${IMAGE_TAG}..."
          # In production, credentials and cluster context are injected via KUBECONFIG secret
          if [ -n "${KUBECONFIG_DATA:-}" ]; then
            mkdir -p $HOME/.kube
            echo "${KUBECONFIG_DATA}" | base64 -d > $HOME/.kube/config
            kubectl set image deployment/aml-fastapi-app fastapi-app=aml-fastapi-app:${IMAGE_TAG} -n aml-system
            kubectl rollout status deployment/aml-fastapi-app -n aml-system --timeout=180s
          else
            echo "Dry-run validation: kubectl set image deployment/aml-fastapi-app fastapi-app=aml-fastapi-app:${IMAGE_TAG} -n aml-system"
          fi

