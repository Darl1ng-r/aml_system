name: Enterprise AML CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security SAST Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Lint Codebase (Ruff)
        run: |
          ruff check .

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-2023-45803

  test:
    name: Run Unit, Integration & Compliance Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pyyaml

      - name: Run Test Suite with Coverage
        env:
          ENABLE_TLS: "false"
          STRICT_MTLS: "false"
          RUN_EMBEDDED_WORKER: "false"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest --cov=routers --cov=services tests/ -v

  container-security:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: aml-system:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aml-system:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
