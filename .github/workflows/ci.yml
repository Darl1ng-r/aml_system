name: Enterprise AML CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  lint-and-audit:
    name: Code Quality, SAST, Secrets & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Kubernetes Manifest Validation (Kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          kubeconform -summary -ignore-missing-schemas -skip ExternalSecret deployments/kubernetes/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Lint & Format Check (Ruff)
        run: |
          ruff check .
          ruff format --check . || true

      - name: Python Security SAST (Bandit)
        run: |
          bandit -r routers services database workers -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-2023-45803

  test:
    name: Run Alembic Migrations & Compliance Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic Database Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
        run: |
          alembic upgrade head

      - name: Run Test Suite with Mandatory 70% Coverage Gate
        env:
          ENABLE_TLS: "false"
          STRICT_MTLS: "false"
          RUN_EMBEDDED_WORKER: "false"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aml_compliance
          POSTGRES_USER: aml_user
          POSTGRES_PASSWORD: aml_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AML_APP_PASSWORD: aml_app_password_test_2026
        run: |
          pytest --cov=routers --cov=services --cov-fail-under=70 tests/ -v

  container-security:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image & Verify Zero Secret/Venv Leakage
        run: |
          docker build -t aml-system:ci-scan .
          docker run --rm aml-system:ci-scan sh -c 'test ! -f /app/.env && test ! -d /app/.venv && python -c "import xgboost, asyncpg"'

      - name: Scan Image with Trivy (Pinned Release, Fail on HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aml-system:ci-scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  deploy:
    name: Continuous Deployment (GHCR Push & Zero-Downtime K8s Rollout)
    runs-on: ubuntu-latest
    needs: [container-security]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Immutable Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.10"

      - name: Deploy to Kubernetes Cluster & Verify Rollout
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          IMAGE_URI: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          if [ -n "${KUBECONFIG_DATA:-}" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "${KUBECONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            kubectl set image deployment/aml-fastapi-app fastapi-app="${IMAGE_URI}" -n aml-system
            kubectl set image deployment/aml-outbox-relay outbox-relay="${IMAGE_URI}" -n aml-system || true
            kubectl rollout status deployment/aml-fastapi-app -n aml-system --timeout=180s
          else
            echo "KUBECONFIG_DATA not configured; validated image ${IMAGE_URI}."
          fi
