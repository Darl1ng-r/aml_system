<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AML Portal - Enterprise Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            min-height: 100vh;
            background-color: var(--bg-primary, #0c1017);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .auth-card {
            background-color: var(--bg-secondary, #161b22);
            border: 1px solid var(--border-color, #30363d);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            padding: 2.25rem 2.25rem 1.5rem 2.25rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color, #30363d);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .auth-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #1d64f5, #1d8253);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0 auto 1rem auto;
            box-shadow: 0 4px 16px rgba(29, 100, 245, 0.3);
        }

        .auth-header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary, #f0f6fc);
            letter-spacing: -0.02em;
            margin: 0;
        }

        .auth-header p {
            font-size: 0.8rem;
            color: var(--text-secondary, #8b949e);
            margin-top: 0.35rem;
            font-weight: 500;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color, #30363d);
            background-color: rgba(0, 0, 0, 0.15);
        }

        .auth-tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary, #8b949e);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            outline: none;
            border-bottom: 2px solid transparent;
        }

        .auth-tab-btn:hover {
            color: var(--text-primary, #f0f6fc);
            background-color: rgba(255, 255, 255, 0.03);
        }

        .auth-tab-btn.active {
            color: #1d64f5;
            border-bottom: 2px solid #1d64f5;
            background-color: transparent;
        }

        .auth-body {
            padding: 2.25rem;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary, #f0f6fc);
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color, #30363d);
            background-color: var(--bg-primary, #0c1017);
            color: var(--text-primary, #f0f6fc);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1d64f5;
            box-shadow: 0 0 0 3px rgba(29, 100, 245, 0.25);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 3.5rem;
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary, #8b949e);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: var(--text-primary, #f0f6fc);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Password Strength Meter */
        .strength-meter {
            margin-top: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .strength-bar-bg {
            height: 4px;
            background-color: var(--border-color, #30363d);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
            border-radius: 2px;
        }

        .strength-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary, #8b949e);
        }

        /* MFA Challenge Screen */
        .mfa-screen {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
            text-align: center;
        }

        .mfa-screen.active {
            display: flex;
        }

        .mfa-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: center;
        }

        .otp-input {
            letter-spacing: 0.4em;
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
        }

        .btn {
            padding: 0.8rem 1.25rem;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #1d64f5;
            color: #ffffff;
        }

        .btn:hover:not(:disabled) {
            background-color: #1551c9;
            box-shadow: 0 4px 12px rgba(29, 100, 245, 0.35);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: #1d8253;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #166942;
            box-shadow: 0 4px 12px rgba(29, 130, 83, 0.35);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color, #30363d);
            color: var(--text-primary, #f0f6fc);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #8b949e;
        }

        .error-banner {
            background-color: rgba(204, 63, 53, 0.12);
            border: 1px solid rgba(204, 63, 53, 0.35);
            color: #ff6b6b;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .success-banner {
            background-color: rgba(29, 130, 83, 0.12);
            border: 1px solid rgba(29, 130, 83, 0.35);
            color: #4ade80;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }
    </style>
    <!-- Lucide Icon Library -->
    <script src="/static/lucide.min.js"></script>
    <!-- Enterprise Auth Controller (Strict CSP Compliant) -->
    <script src="/static/login.js" defer></script>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" aria-hidden="true">
                    <i data-lucide="shield-check" style="width:28px;height:28px;stroke:#ffffff;stroke-width:2.2;"></i>
                </div>
                <h1>AML Control Center</h1>
                <p>Enterprise Compliance & Multi-Tenant Gateway</p>
            </div>

            <div id="auth-tab-bar" class="auth-tabs" role="tablist">
                <button type="button" id="tab-login" class="auth-tab-btn active" role="tab" aria-selected="true" aria-controls="form-login">Sign In</button>
                <button type="button" id="tab-signup" class="auth-tab-btn" role="tab" aria-selected="false" aria-controls="form-signup">Create Account</button>
            </div>

            <div class="auth-body">
                <div id="auth-error" class="error-banner" style="margin-bottom: 1.25rem;" role="alert"></div>
                <div id="auth-success" class="success-banner" style="margin-bottom: 1.25rem;" role="status"></div>

                <!-- 1. LOGIN FORM -->
                <form id="form-login" class="auth-form active" role="tabpanel" novalidate>
                    <div class="form-group">
                        <label for="login-username">Username or Email</label>
                        <input type="text" id="login-username" placeholder="e.g. sarah_jenkins or officer@aml.com" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" placeholder="••••••••••••" autocomplete="current-password" required>
                            <button type="button" id="toggle-login-pass" class="password-toggle-btn" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button type="submit" id="btn-login-submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Access Console</button>
                </form>

                <!-- 2. MFA CHALLENGE FORM -->
                <form id="form-mfa" class="mfa-screen" novalidate>
                    <div class="mfa-icon">
                        <i data-lucide="key-round" style="width:36px;height:36px;stroke:#f4a261;stroke-width:2;"></i>
                    </div>
                    <h2 style="font-size: 1.15rem; font-weight: 700; margin: 0; color: var(--text-primary, #f0f6fc);">Two-Factor Verification</h2>
                    <p style="font-size: 0.8rem; color: var(--text-secondary, #8b949e); margin: 0;">Enter the 6-digit verification code from your authenticator app or an emergency recovery code.</p>

                    <div class="form-group">
                        <input type="text" id="mfa-code" class="otp-input" placeholder="000000" maxlength="15" autocomplete="one-time-code" required>
                    </div>

                    <button type="submit" id="btn-mfa-submit" class="btn" style="width: 100%;">Verify & Proceed</button>
                    <button type="button" id="btn-mfa-cancel" class="btn btn-secondary" style="width: 100%;">Cancel</button>
                </form>

                <!-- 3. SIGNUP FORM -->
                <form id="form-signup" class="auth-form" role="tabpanel" novalidate>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="signup-username">Username or Email</label>
                            <span id="username-avail-badge" style="display: none; font-size: 11px; font-weight: 700;"></span>
                        </div>
                        <input type="text" id="signup-username" placeholder="e.g. alex_compliance or alex@aml.com" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Passphrase (NIST SP 800-63B Compliant)</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" placeholder="Minimum 10–12 characters" autocomplete="new-password" required>
                            <button type="button" id="toggle-signup-pass" class="password-toggle-btn" aria-label="Show password">Show</button>
                        </div>
                        <div class="strength-meter" aria-live="polite">
                            <div class="strength-bar-bg">
                                <div id="strength-bar" class="strength-bar-fill"></div>
                            </div>
                            <span id="strength-text" class="strength-label">Password Strength: Minimum 10–12 chars</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm">Confirm Passphrase</label>
                        <input type="password" id="signup-confirm" placeholder="Re-enter passphrase" autocomplete="new-password" required>
                    </div>
                    <button type="submit" id="btn-signup-submit" class="btn btn-success" style="width: 100%; margin-top: 0.5rem;">Register Analyst Profile</button>
                </form>

                <!-- Federated SSO Identity Providers -->
                <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color, #30363d); text-align: center;">
                    <span style="font-size: 11px; color: var(--text-secondary, #8b949e); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Or Federated Enterprise SSO</span>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                        <button type="button" id="btn-sso-google" class="btn btn-secondary" style="font-size: 12px; padding: 8px 10px;">
                            Google SSO
                        </button>
                        <button type="button" id="btn-sso-github" class="btn btn-secondary" style="font-size: 12px; padding: 8px 10px;">
                            GitHub Corp
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
