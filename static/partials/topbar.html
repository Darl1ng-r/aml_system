    <!-- Single Shared 56px Enterprise Topbar Component (static/partials/topbar.html) -->
    <header class="{{HEADER_CLASS}}">
      <div class="sentinel-topbar-left">
        <a href="/dashboard/executive" class="sentinel-brand" aria-label="Sentinel Home">
          <span class="sentinel-brand-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span>Sentinel</span>
        </a>
      </div>

      <div class="sentinel-topbar-center">
        <nav class="nav-pills" role="navigation" aria-label="Core Platform Views">
          <a href="/dashboard/executive" class="nav-pill{{ACTIVE_OVERVIEW}}"{{ARIA_OVERVIEW}} title="Executive &amp; Compliance Overview">Overview</a>
          <a href="/alerts/triage" class="nav-pill{{ACTIVE_TRIAGE}}"{{ARIA_TRIAGE}} title="Alert Triage Queue">Triage</a>
          <a href="/dashboard" class="nav-pill{{ACTIVE_INVESTIGATIONS}}"{{ARIA_INVESTIGATIONS}} title="Case Investigation Workspace">Investigations</a>
          <a href="/network" class="nav-pill{{ACTIVE_NETWORK}}"{{ARIA_NETWORK}} title="Entity Link Analysis &amp; Network Graph">Network</a>
        </nav>
      </div>

      <div class="sentinel-topbar-right">
        <button type="button" id="sentinel-cmdk-trigger" class="sentinel-shell-btn" title="Global Search &amp; Command Palette (Cmd+K / Ctrl+K)">
          <span>Search</span><span class="sentinel-shell-kbd">⌘K</span>
        </button>

        <div class="sentinel-notif-wrap">
          <button type="button" id="sentinel-notif-bell" class="sentinel-shell-btn" aria-label="Notifications" title="SLA &amp; Compliance Notifications">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <span id="sentinel-notif-badge" class="sentinel-notif-badge">0</span>
        </div>

        <div class="app-launcher-dropdown">
          <button type="button" class="topbar-btn" id="btn-sentinel-modules" onclick="toggleSentinelModules(event)" aria-haspopup="true" aria-expanded="false" title="All Platform Modules">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Modules</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <div class="dropdown-menu" id="sentinel-modules-menu" style="display:none;">
            <div class="dropdown-group-label">Investigations &amp; Reporting</div>
            <a href="/customers" class="dropdown-item">Customer 360 Dossier</a>
            <a href="/sar/editor" class="dropdown-item">SAR / STR Draft Editor</a>
            <a href="/sar/queue" class="dropdown-item" data-role="MLRO,ADMIN">SAR Filing Queue</a>
            <a href="/compliance/ops" class="dropdown-item">Compliance Ops Hub</a>

            <div class="dropdown-divider"></div>

            <div class="dropdown-group-label">Governance &amp; Admin</div>
            <a href="/admin/rules" class="dropdown-item" data-role="ADMIN">Rule &amp; Threshold Builder</a>
            <a href="/ml/governance" class="dropdown-item" data-role="ADMIN,MLRO">AI &amp; Model Governance</a>
            <a href="/settings/risk-appetite" class="dropdown-item" data-role="MLRO,ADMIN">Risk Appetite Settings</a>
            <a href="/audit/logs" class="dropdown-item" data-role="AUDITOR,GLOBAL_AUDITOR,ADMIN">Immutable Audit Vault</a>
            <a href="/admin/users" class="dropdown-item" data-role="ADMIN">Team &amp; RBAC</a>
            <a href="/admin/health" class="dropdown-item" data-role="ADMIN">System Health</a>
          </div>
        </div>

        <button type="button" class="sentinel-icon-btn" id="sentinel-user-avatar" onclick="window.location.href='/admin/users'" title="Account Profile" aria-label="Account Profile">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>

        <button type="button" class="sentinel-icon-btn sentinel-icon-btn--danger" onclick="logout()" title="Sign Out" aria-label="Sign Out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>
