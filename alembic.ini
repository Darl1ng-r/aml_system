# Alembic Configuration File

[alembic]
# Path to the migration scripts directory
script_location = migrations

# Template used to generate new migration scripts
file_template = %%(rev)s_%%(slug)s

# Timezone for migration revision timestamps
timezone = UTC

# The SQLAlchemy URL is read from the environment in env.py,
# so we leave this empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
