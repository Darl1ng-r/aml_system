syntax = "proto3";

package aml.graph.v1;

option go_package = "github.com/aml/proto/graph/v1;graphv1";
option py_generic_services = true;

service GraphIntelligenceService {
  rpc GetEntityTopology (EntityTopologyRequest) returns (EntityTopologyResponse);
  rpc DetectCircularLoops (CircularLoopRequest) returns (CircularLoopResponse);
  rpc GetBetweennessCentrality (CentralityRequest) returns (CentralityResponse);
}

message EntityTopologyRequest {
  string tenant_id = 1;
  string account_id = 2;
  int32 max_depth = 3;
  double min_amount_filter = 4;
}

message Node {
  string id = 1;
  string label = 2; // "Account", "CorporateEntity", "UBO"
  map<string, string> properties = 3;
}

message Edge {
  string source_id = 1;
  string target_id = 2;
  string relationship = 3; // "TRANSFERRED_TO", "OWNS_UBO", "BENEFICIARY_OF"
  double weight = 4;
  int64 timestamp = 5;
}

message EntityTopologyResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
  double betweenness_centrality_rank = 3;
  bool is_high_risk_intermediary = 4;
}

message CircularLoopRequest {
  string tenant_id = 1;
  int32 min_cycle_size = 2;
  int32 max_cycle_size = 3;
  int64 lookback_hours = 4;
}

message CyclePath {
  repeated string account_ids = 1;
  double total_volume = 2;
  int32 hop_count = 3;
}

message CircularLoopResponse {
  repeated CyclePath detected_cycles = 1;
  int32 total_cycles_found = 2;
}

message CentralityRequest {
  string tenant_id = 1;
  int32 top_n = 2;
}

message CentralityRanking {
  string account_id = 1;
  double score = 2;
  int32 transaction_count = 3;
}

message CentralityResponse {
  repeated CentralityRanking rankings = 1;
}
