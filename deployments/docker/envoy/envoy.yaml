admin:
  access_log_path: /dev/null
  address:
    socket_address:
      # P1-08: Loopback-only admin interface (never expose unauthenticated admin on 0.0.0.0)
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          use_remote_address: true
          xff_num_trusted_hops: 1
          server_header_transformation: PASS_THROUGH
          route_config:
            name: aml_route_config
            response_headers_to_remove:
            - "server"
            - "x-envoy-upstream-service-time"
            virtual_hosts:
            - name: aml_services
              domains: ["localhost:10000", "127.0.0.1:10000", "aml.example.com", "aml-envoy-gateway:10000"]
              routes:
              # 1. IAM & Authentication Microservice Routes
              - match:
                  prefix: "/api/v1/auth"
                route:
                  cluster: iam_service
                  timeout: 5s
                  retry_policy:
                    retry_on: "connect-failure,refused-stream,reset"
                    num_retries: 2
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              - match:
                  exact: "/.well-known/jwks.json"
                route:
                  cluster: iam_service
                  timeout: 2s
                  retry_policy:
                    retry_on: "connect-failure,5xx"
                    num_retries: 2
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-internal-gateway-token"

              # 2. Ingestion & Transaction Processing Routes
              - match:
                  prefix: "/api/v1/transactions"
                route:
                  cluster: aml_monolith
                  timeout: 5s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              # 3. Screening & Sanctions Routes
              - match:
                  prefix: "/api/v1/screening"
                route:
                  cluster: aml_monolith
                  timeout: 6s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              # 4. FinCEN / Regulatory Filing Routes (aligned with 25s upstream read timeout)
              - match:
                  prefix: "/api/v1/fincen"
                route:
                  cluster: aml_monolith
                  timeout: 30s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              # 5. Case Management & Regulatory Reporting Routes
              - match:
                  prefix: "/api/v1/cases"
                route:
                  cluster: aml_monolith
                  timeout: 15s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              - match:
                  prefix: "/api/v1/reports"
                route:
                  cluster: aml_monolith
                  timeout: 20s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

              # 6. Fallback Route to Core AML Application
              - match:
                  prefix: "/"
                route:
                  cluster: aml_monolith
                  timeout: 15s
                  request_headers_to_remove:
                  - "x-user-id"
                  - "x-tenant-id"
                  - "x-user-roles"
                  - "x-user-name"
                  - "x-mfa-verified"
                  - "x-internal-gateway-token"
                  - "x-real-ip"
                  request_headers_to_add:
                  - header:
                      key: "x-internal-gateway-token"
                      value: "${INTERNAL_GATEWAY_SECRET}"
                    append: false

          http_filters:
          # P1-02 / P1-08: Hard request payload cap (26 MiB) at Envoy gateway boundary
          - name: envoy.filters.http.buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
              max_request_bytes: 27262976
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: iam_service
    connect_timeout: 0.5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - max_connections: 256
        max_pending_requests: 128
        max_requests: 512
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 5
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
    health_checks:
    - timeout: 2s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health/live"
    load_assignment:
      cluster_name: iam_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-service
                port_value: 8001

  - name: aml_monolith
    connect_timeout: 0.5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - max_connections: 512
        max_pending_requests: 256
        max_requests: 1024
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 5
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
    health_checks:
    - timeout: 2s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health/live"
    load_assignment:
      cluster_name: aml_monolith
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: fastapi-app
                port_value: 8000
