admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: aml_route_config
            virtual_hosts:
            - name: aml_services
              domains: ["*"]
              routes:
              # 1. IAM & Authentication Microservice Routes
              - match:
                  prefix: "/api/v1/auth"
                route:
                  cluster: iam_service
                  timeout: 5s
              - match:
                  exact: "/.well-known/jwks.json"
                route:
                  cluster: iam_service
                  timeout: 2s

              # 2. Ingestion & Transaction Processing Routes
              - match:
                  prefix: "/api/v1/transactions"
                route:
                  cluster: aml_monolith
                  timeout: 3s

              # 3. Screening & Sanctions Routes
              - match:
                  prefix: "/api/v1/screening"
                route:
                  cluster: aml_monolith
                  timeout: 4s

              # 4. Case Management & Regulatory Reporting Routes
              - match:
                  prefix: "/api/v1/cases"
                route:
                  cluster: aml_monolith
                  timeout: 10s
              - match:
                  prefix: "/api/v1/reports"
                route:
                  cluster: aml_monolith
                  timeout: 15s

              # 5. Fallback Route to Core AML Application
              - match:
                  prefix: "/"
                route:
                  cluster: aml_monolith
                  timeout: 15s

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # IAM Microservice Cluster
  - name: iam_service
    connect_timeout: 0.5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: iam_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-service
                port_value: 8001

  # Core Application / Strangler Fig Fallback Cluster
  - name: aml_monolith
    connect_timeout: 0.5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: aml_monolith
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: fastapi-app
                port_value: 8000
