# PostgreSQL Primary Configuration — Streaming Replication
# =========================================================
# This file is mounted into the primary container.

listen_addresses = '*'
port = 5432

# ── WAL & Replication ────────────────────────────────────────────────────
wal_level = replica
max_wal_senders = 5
wal_keep_size = '256MB'
hot_standby = on

# ── Connection limits ────────────────────────────────────────────────────
max_connections = 200

# ── Logging ──────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
