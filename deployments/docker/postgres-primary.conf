# PostgreSQL Primary Configuration — Streaming Replication
# =========================================================
# This file is mounted into the primary container.

listen_addresses = '*'
port = 5432

# ── WAL & Replication ────────────────────────────────────────────────────
wal_level = replica
max_wal_senders = 5
wal_keep_size = '256MB'
hot_standby = on

# ── Connection limits ────────────────────────────────────────────────────
max_connections = 200

# ── Logging & Query Telemetry ────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = 'all'
track_io_timing = on
log_lock_waits = on
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
