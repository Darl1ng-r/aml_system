global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager.monitoring.svc.cluster.local:9093"

scrape_configs:
  - job_name: "aml-fastapi-app"
    metrics_path: "/metrics"
    scheme: "http"
    bearer_token_file: "/var/run/secrets/monitoring/metrics_secret"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - aml-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: aml-fastapi-app
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        replacement: $1:8000
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: instance

  - job_name: "postgres-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter.monitoring.svc.cluster.local:9187"]
        labels:
          tier: "database"
          service: "postgres"

  - job_name: "redis-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter.monitoring.svc.cluster.local:9121"]
        labels:
          tier: "cache"
          service: "redis"

  - job_name: "redpanda-metrics"
    scrape_interval: 10s
    metrics_path: "/public_metrics"
    static_configs:
      - targets:
          # P2-24: Correct headless service name matching deployments/kubernetes/redpanda.yaml
          - "aml-redpanda-0.aml-redpanda-headless.aml-system.svc.cluster.local:9644"
          - "aml-redpanda-1.aml-redpanda-headless.aml-system.svc.cluster.local:9644"
          - "aml-redpanda-2.aml-redpanda-headless.aml-system.svc.cluster.local:9644"
        labels:
          tier: "messaging"
          service: "redpanda"
