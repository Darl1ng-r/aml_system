# ════════════════════════════════════════════════════════════════════════════
# AML Sentinel — Edge CDN, WAF & Edge Rate Limiting Policy (Scale Stage 2)
# ════════════════════════════════════════════════════════════════════════════
# Declarative Edge Policy targeting Cloudflare Enterprise / AWS CloudFront.
# Offloads 80-90% of static + public JWKS traffic at the edge while strictly
# enforcing `BYPASS_CACHE` and `CDN-Cache-Control: no-store` on all
# authenticated/PII API endpoints and workspace HTML shells.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: edge.aml-sentinel.io/v1
kind: EdgeCDNPolicy
metadata:
  name: aml-sentinel-edge-policy
  environment: production
spec:
  providers:
    primary: cloudflare
    portable_target: aws-cloudfront
  transport:
    tls_min_version: "1.3"
    http3_enabled: true
    brotli_compression: true
    authenticated_origin_pulls_mtls: true
    origin_shield_enabled: true
  cache_rules:
    - id: immutable-versioned-static-assets
      priority: 10
      match:
        path_prefix: "/static/"
        query_contains: "v="
        methods: ["GET", "HEAD"]
      action: CACHE
      edge_ttl_seconds: 31536000
      browser_ttl_seconds: 31536000
      respect_origin_cdn_cache_control: true
      cache_key_ignore_cookies: true
    - id: unversioned-static-assets
      priority: 20
      match:
        path_prefix: "/static/"
        methods: ["GET", "HEAD"]
      action: CACHE
      edge_ttl_seconds: 300
      stale_while_revalidate_seconds: 60
      respect_origin_cdn_cache_control: true
      cache_key_ignore_cookies: true
    - id: public-oidc-jwks
      priority: 30
      match:
        exact_path: "/.well-known/jwks.json"
        methods: ["GET", "HEAD"]
      action: CACHE
      edge_ttl_seconds: 300
      stale_while_revalidate_seconds: 60
      respect_origin_cdn_cache_control: true
      cache_key_ignore_cookies: true
    - id: bypass-all-api-pii-endpoints
      priority: 100
      match:
        path_prefix: "/api/"
      action: BYPASS_CACHE
      enforce_response_headers:
        Cache-Control: "no-store"
        CDN-Cache-Control: "no-store"
    - id: bypass-authenticated-sessions-and-rfi
      priority: 110
      match:
        any_of:
          - path_prefix: "/rfi/"
          - path_prefix: "/dashboard"
          - path_prefix: "/alerts"
          - path_prefix: "/cases"
          - path_prefix: "/audit"
          - header_present: "Authorization"
          - cookie_present: "access_token"
      action: BYPASS_CACHE
      enforce_response_headers:
        CDN-Cache-Control: "no-store"
  waf:
    mode: BLOCK
    managed_rulesets:
      - name: cloudflare-managed-ruleset
        enabled: true
        action: block
      - name: owasp-core-ruleset
        enabled: true
        paranoia_level: 2
        anomaly_score_threshold: 40
        action: block
    bot_protection:
      turnstile_enforced_paths:
        - "/api/v1/auth/login"
        - "/api/v1/auth/register"
        - "/api/v1/rfi/public/*"
    custom_rules:
      - id: block-cloud-metadata-ssrf
        expression: '(http.request.uri contains "169.254.169.254") or (http.request.uri contains "metadata.google.internal")'
        action: block
      - id: block-path-traversal
        expression: '(http.request.uri.path contains "..") or (http.request.uri.path contains "%2e%2e")'
        action: block
      - id: block-oversized-payloads
        max_body_bytes: 27262976  # 26 MiB ceiling aligned with NGINX ingress
        action: block
  edge_rate_limiting:
    - id: auth-bruteforce-edge-shield
      match:
        path_prefix: "/api/v1/auth/"
        methods: ["POST"]
      requests_per_period: 20
      period_seconds: 60
      counting_key: "ip.src"
      action: block
      mitigation_timeout_seconds: 300
    - id: transaction-ingest-burst-shield
      match:
        path_prefix: "/api/v1/transactions"
        methods: ["POST"]
      requests_per_period: 500
      period_seconds: 60
      counting_key: "ip.src"
      action: challenge_or_429
      mitigation_timeout_seconds: 60
    - id: global-ip-ddos-ceiling
      match:
        path_prefix: "/"
      requests_per_period: 1200
      period_seconds: 60
      counting_key: "ip.src"
      action: block
      mitigation_timeout_seconds: 120
