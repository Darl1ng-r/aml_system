---
# TLS-Terminating Ingress for the AML API
# Security headers (HSTS, CSP, X-Frame-Options, nosniff, Referrer-Policy) are
# owned canonically by FastAPI SecurityHeadersMiddleware (no deprecated
# configuration-snippet annotations — fixes P1-02 & P3-02).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aml-ingress
  namespace: aml-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # P1-02: Align ingress body cap (26m) with 25 MB evidence upload ceiling
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "35"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "35"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - aml.example.com
    secretName: aml-tls-cert
  rules:
  - host: aml.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aml-fastapi-service
            port:
              number: 8000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
