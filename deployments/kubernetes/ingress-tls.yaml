---
# TLS-Terminating Ingress for the AML API
# Routes all external HTTPS traffic to the FastAPI service.
# TLS certificate is managed via cert-manager (Let's Encrypt or corp CA).
#
# Prerequisites:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   kubectl apply -f issuer.yaml  (ClusterIssuer for Let's Encrypt)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aml-ingress
  namespace: aml-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # HSTS: tell browsers to only use HTTPS for 1 year
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting at the ingress layer (backs up the app-layer Redis limiter)
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - aml.yourdomain.com          # ← replace with your actual domain
    secretName: aml-tls-cert      # cert-manager will populate this secret
  rules:
  - host: aml.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aml-fastapi-service
            port:
              number: 8000
---
# cert-manager ClusterIssuer (Let's Encrypt ACME)
# Replace the email and server for your environment.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@yourdomain.com    # ← replace with your security team email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
