# ════════════════════════════════════════════════════════════════════════════
# Internal CA Hierarchy & Service TLS Certificates (Fixes P0-03)
# ============================================================================
# Uses a real 2-tier cert-manager CA chain (self-signed bootstrap -> internal CA
# -> leaf certificate with exact Kubernetes *-service & FQDN SANs).
# NOTE: Deploy EITHER Istio mesh mTLS OR application-level TLS (ENABLE_TLS=true),
# not both simultaneously unless Istio PERMISSIVE mode is chosen during cutover.
# ════════════════════════════════════════════════════════════════════════════

# 1. Bootstrap Self-Signed ClusterIssuer (cluster-scoped — no metadata.namespace)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aml-selfsigned-bootstrap
spec:
  selfSigned: {}
---
# 2. Internal Root CA Certificate (isCA: true)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aml-internal-ca
  namespace: aml-system
spec:
  isCA: true
  commonName: aml-internal-ca.aml-system.svc.cluster.local
  secretName: aml-internal-ca-secret
  duration: 43800h # 5 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: aml-selfsigned-bootstrap
    kind: ClusterIssuer
---
# 3. Namespace CA Issuer backed by aml-internal-ca-secret
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aml-internal-ca-issuer
  namespace: aml-system
spec:
  ca:
    secretName: aml-internal-ca-secret
---
# 4. Internal Service Leaf Certificate covering ALL real Kubernetes service DNS names
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aml-internal-services-tls
  namespace: aml-system
spec:
  secretName: aml-internal-services-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h
  subject:
    organizations:
    - AML Compliance Services
  commonName: aml-fastapi-service.aml-system.svc.cluster.local
  dnsNames:
  - aml-fastapi-app
  - aml-fastapi-service
  - aml-fastapi-service.aml-system.svc.cluster.local
  - aml-pgbouncer-service
  - aml-pgbouncer-service.aml-system.svc.cluster.local
  - aml-postgres
  - aml-postgres-primary
  - aml-postgres-primary.aml-system.svc.cluster.local
  - aml-postgres-replica
  - aml-postgres-replica.aml-system.svc.cluster.local
  - aml-postgres-service
  - aml-postgres-service.aml-system.svc.cluster.local
  - aml-redis-service
  - aml-redis-service.aml-system.svc.cluster.local
  - aml-neo4j-service
  - aml-neo4j-service.aml-system.svc.cluster.local
  - aml-elasticsearch-service
  - aml-elasticsearch-service.aml-system.svc.cluster.local
  - aml-redpanda-service
  - aml-redpanda-service.aml-system.svc.cluster.local
  - aml-redpanda-headless
  - "*.aml-redpanda-headless.aml-system.svc.cluster.local"
  issuerRef:
    name: aml-internal-ca-issuer
    kind: Issuer
