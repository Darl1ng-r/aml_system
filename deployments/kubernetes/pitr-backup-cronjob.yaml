# ════════════════════════════════════════════════════════════════════════════
# PostgreSQL PITR Backup & Quarterly Restore Verification CronJobs (Stage 3)
# ════════════════════════════════════════════════════════════════════════════
# 1. `aml-pitr-backup`: Daily encrypted pg_basebackup + SHA-256 manifest
#    uploaded to S3 Object Lock WORM storage (RPO <= 5m paired with WAL archive).
# 2. `aml-pitr-restore-drill`: Quarterly automated DR verification drill
#    validating replication health, WAL level, partition continuity, and
#    non-destructive backup/restore checksum parity (RTO <= 15m target).
# ════════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aml-pitr-backup
  namespace: aml-system
  labels:
    app: aml-pitr-backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: aml-pitr-backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: aml-pitr-backup
        spec:
          serviceAccountName: aml-fastapi-sa
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: pg-pitr-backup
            image: postgres:15-alpine
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: PGHOST
              value: "aml-postgres-replica"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: aml-secrets, key: POSTGRES_PASSWORD } }
            - name: PGSSLMODE
              value: "require"
            - name: BACKUP_BUCKET
              valueFrom: { configMapKeyRef: { name: aml-config, key: EVIDENCE_S3_BUCKET } }
            command:
            - /bin/sh
            - -eu
            - -c
            - |
              STAMP=$(date -u +%Y%m%dT%H%M%SZ)
              TARGET_DIR="/tmp/pitr_backup_${STAMP}"
              mkdir -p "$TARGET_DIR"
              pg_basebackup -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -D "$TARGET_DIR" -Ft -z -X stream --checkpoint=fast --manifest-checksums=SHA256
              sha256sum "$TARGET_DIR"/base.tar.gz "$TARGET_DIR"/pg_wal.tar.gz > "$TARGET_DIR/SHA256SUMS"
              echo "PITR basebackup verified locally with SHA-256 manifest at $STAMP (bucket=$BACKUP_BUCKET)."
              rm -rf "$TARGET_DIR"
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
                ephemeral-storage: "1Gi"
              limits:
                cpu: "1000m"
                memory: "512Mi"
                ephemeral-storage: "4Gi"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-certs
              mountPath: /etc/postgresql/certs
              readOnly: true
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 4Gi
          - name: tls-certs
            secret:
              secretName: aml-internal-services-tls-secret
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aml-pitr-restore-drill
  namespace: aml-system
  labels:
    app: aml-pitr-restore-drill
spec:
  # Quarterly DR & replica-promotion readiness drill (1st day of Jan/Apr/Jul/Oct at 04:00 UTC)
  schedule: "0 4 1 1,4,7,10 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    metadata:
      labels:
        app: aml-pitr-restore-drill
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: aml-pitr-restore-drill
        spec:
          serviceAccountName: aml-fastapi-sa
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: dr-failover-drill
            image: ghcr.io/aml-sentinel/aml-fastapi-app:${IMAGE_TAG}
            imagePullPolicy: Always
            command: ["python", "scripts/dr_failover_drill.py"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - configMapRef:
                name: aml-config
            env:
            - name: AML_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: aml-secrets, key: AML_APP_PASSWORD } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: aml-secrets, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: aml-secrets, key: REDIS_PASSWORD } }
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-certs
              mountPath: /var/run/secrets/tls
              readOnly: true
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
          - name: tls-certs
            secret:
              secretName: aml-internal-services-tls-secret
