# ════════════════════════════════════════════════════════════════════════════
# PostgreSQL Primary + Multi-Replica Streaming Read Standby Cluster (Stage 2)
# ════════════════════════════════════════════════════════════════════════════
# Architecture (Option A — Native K8s Load-Balanced Multi-Replica Read Pool):
#   - `aml-postgres` (replicas: 1)         = Read-Write Primary (`aml-postgres-primary`)
#   - `aml-postgres-replica` (replicas: 2) = 2+ Hot-Standby Streaming Replicas
#     spread across Availability Zones behind the `aml-postgres-replica` Service.
#
# Each standby pod clones from `aml-postgres-primary` via `pg_basebackup -R`
# and enforces `pg_is_in_recovery()` in its readinessProbe so only live
# streaming replicas serve read-heavy SELECT traffic.
# ════════════════════════════════════════════════════════════════════════════

# ── ConfigMap: PostgreSQL configuration ──────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: aml-postgres-config
  namespace: aml-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432
    wal_level = replica
    max_wal_senders = 10
    max_replication_slots = 10
    wal_keep_size = '512MB'
    hot_standby = on
    hot_standby_feedback = on
    max_connections = 200
    password_encryption = 'scram-sha-256'
    ssl = on
    ssl_cert_file = '/etc/postgresql/certs/tls.crt'
    ssl_key_file = '/etc/postgresql/certs/tls.key'
    ssl_ca_file = '/etc/postgresql/certs/ca.crt'
    ssl_min_protocol_version = 'TLSv1.2'
    log_line_prefix = '%m [%p] %q%u@%d '
    log_min_duration_statement = 500
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 5000
    pg_stat_statements.track = 'all'
    track_io_timing = on
    log_lock_waits = on

  pg_hba.conf: |
    # TYPE    DATABASE  USER         ADDRESS        METHOD
    local     all       all                         scram-sha-256
    hostssl   all       all          10.0.0.0/8     scram-sha-256
    hostssl   all       all          172.16.0.0/12  scram-sha-256
    hostssl   replication replicator 10.0.0.0/8     scram-sha-256
    hostssl   replication postgres   10.0.0.0/8     scram-sha-256
    hostssl   replication replicator 172.16.0.0/12  scram-sha-256
    hostssl   replication postgres   172.16.0.0/12  scram-sha-256
---
# ── Primary StatefulSet (Read-Write) ─────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aml-postgres
  namespace: aml-system
  labels:
    app: aml-postgres
    role: primary
spec:
  serviceName: aml-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: aml-postgres
  template:
    metadata:
      labels:
        app: aml-postgres
        role: primary
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: dbport
        env:
        - name: POSTGRES_DB
          value: aml_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        - -c
        - hba_file=/etc/postgresql/pg_hba.conf
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: "512Mi"
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - aml_db
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        - name: tls-certs
          mountPath: /etc/postgresql/certs
          readOnly: true
      volumes:
      - name: postgres-config
        configMap:
          name: aml-postgres-config
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
          defaultMode: 0600
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
# ── Streaming Read Replicas StatefulSet (2+ Hot Standbys across AZs) ─────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aml-postgres-replica
  namespace: aml-system
  labels:
    app: aml-postgres-replica
    role: replica
spec:
  serviceName: aml-postgres-replica-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: aml-postgres-replica
  template:
    metadata:
      labels:
        app: aml-postgres-replica
        role: replica
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aml-postgres-replica
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aml-postgres
              topologyKey: topology.kubernetes.io/zone
          - weight: 90
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aml-postgres-replica
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: replica-bootstrap
        image: postgres:15-alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
            ephemeral-storage: "256Mi"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - bash
        - -c
        - |
          set -e
          if [ -s "$PGDATA/PG_VERSION" ]; then
            echo "Replica PGDATA already initialized — skipping pg_basebackup."
            exit 0
          fi
          echo "Bootstrapping streaming read replica $POD_NAME from aml-postgres-primary..."
          until pg_isready -h aml-postgres-primary.aml-system.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          PGPASSWORD="$POSTGRES_PASSWORD" pg_basebackup \
            -h aml-postgres-primary.aml-system.svc.cluster.local \
            -p 5432 -U postgres -D "$PGDATA" -Fp -Xs -P -R
          touch "$PGDATA/standby.signal"
          cat >> "$PGDATA/postgresql.auto.conf" <<EOF
          primary_conninfo = 'host=aml-postgres-primary.aml-system.svc.cluster.local port=5432 user=postgres password=$POSTGRES_PASSWORD sslmode=require application_name=$POD_NAME'
          EOF
          echo "Replica $POD_NAME bootstrap complete."
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      containers:
      - name: postgres-replica
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: dbport
        env:
        - name: POSTGRES_DB
          value: aml_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        - -c
        - hba_file=/etc/postgresql/pg_hba.conf
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
            ephemeral-storage: "512Mi"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 8"]
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres -d aml_db && psql -U postgres -d aml_db -tAc "SELECT pg_is_in_recovery()" | grep -q t
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        - name: tls-certs
          mountPath: /etc/postgresql/certs
          readOnly: true
      volumes:
      - name: postgres-config
        configMap:
          name: aml-postgres-config
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
          defaultMode: 0600
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
# Read-Write Primary Service (routes strictly to primary pod-0)
apiVersion: v1
kind: Service
metadata:
  name: aml-postgres-primary
  namespace: aml-system
  labels:
    app: aml-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    statefulset.kubernetes.io/pod-name: aml-postgres-0
---
# Headless Service for Primary StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: aml-postgres-service
  namespace: aml-system
  labels:
    app: aml-postgres
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: aml-postgres
---
# Headless Service for Replica StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: aml-postgres-replica-headless
  namespace: aml-system
  labels:
    app: aml-postgres-replica
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: aml-postgres-replica
---
# Load-Balanced Read-Only Replica Service (distributes SELECTs across all 2+ standby pods)
# NOTE: For automated primary failover in production, pair with CloudNativePG or Patroni.
apiVersion: v1
kind: Service
metadata:
  name: aml-postgres-replica
  namespace: aml-system
  labels:
    app: aml-postgres-replica
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: aml-postgres-replica
