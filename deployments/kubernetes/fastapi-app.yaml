apiVersion: v1
kind: ServiceAccount
metadata:
  name: aml-fastapi-sa
  namespace: aml-system
  labels:
    app: aml-fastapi-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-fastapi-app
  namespace: aml-system
  labels:
    app: aml-fastapi-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aml-fastapi-app
  template:
    metadata:
      labels:
        app: aml-fastapi-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # HashiCorp Vault Agent Injector Configuration (single unified secret-volume-path)
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "aml-api-role"
        vault.hashicorp.com/secret-volume-path: "/var/run/secrets/tls"
        vault.hashicorp.com/agent-inject-secret-ca.crt: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-ca.crt: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.issuing_ca }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.certificate }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-tls.key: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-tls.key: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.private_key }}
          {{- end -}}
    spec:
      serviceAccountName: aml-fastapi-sa
      # Required for Vault Agent Injector Kubernetes Auth method
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aml-fastapi-app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: fastapi-app
        # Immutable image tag placeholder (Replaced by CI/CD with ghcr.io/<repo>:sha-<commit>)
        image: ghcr.io/aml-sentinel/aml-fastapi-app:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: "512Mi"
        envFrom:
        - secretRef:
            name: aml-secrets
        - configMapRef:
            name: aml-config
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aml-fastapi-service
  namespace: aml-system
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: aml-fastapi-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-fastapi-hpa
  namespace: aml-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-fastapi-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
