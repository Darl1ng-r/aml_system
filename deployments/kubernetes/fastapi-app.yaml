apiVersion: v1
kind: ServiceAccount
metadata:
  name: aml-fastapi-sa
  namespace: aml-system
  labels:
    app: aml-fastapi-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-fastapi-app
  namespace: aml-system
  labels:
    app: aml-fastapi-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aml-fastapi-app
  template:
    metadata:
      labels:
        app: aml-fastapi-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # P0-03: Single Vault PKI issue call emitting unified bundle.pem (matching cert + key + CA)
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "aml-api-role"
        vault.hashicorp.com/secret-volume-path: "/var/run/secrets/tls"
        vault.hashicorp.com/agent-inject-secret-bundle.pem: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-bundle.pem: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.certificate }}
          {{ .Data.private_key }}
          {{ .Data.issuing_ca }}
          {{- end -}}
    spec:
      serviceAccountName: aml-fastapi-sa
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aml-fastapi-app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: fastapi-app
        image: ghcr.io/aml-sentinel/aml-fastapi-app:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: "512Mi"
        envFrom:
        - configMapRef:
            name: aml-config
        # P2-19: Least-privilege secret injection (excludes POSTGRES_PASSWORD superuser)
        env:
        - name: AML_APP_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: AML_APP_PASSWORD } }
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: REDIS_PASSWORD } }
        - name: JWT_PRIVATE_KEY_PEM
          valueFrom: { secretKeyRef: { name: aml-secrets, key: JWT_PRIVATE_KEY_PEM } }
        - name: JWT_PREVIOUS_PUBLIC_KEY_PEM
          valueFrom: { secretKeyRef: { name: aml-secrets, key: JWT_PREVIOUS_PUBLIC_KEY_PEM, optional: true } }
        - name: JWT_ALGORITHM
          valueFrom: { secretKeyRef: { name: aml-secrets, key: JWT_ALGORITHM } }
        - name: PII_ENCRYPTION_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: PII_ENCRYPTION_KEY } }
        - name: METRICS_SECRET
          valueFrom: { secretKeyRef: { name: aml-secrets, key: METRICS_SECRET } }
        - name: INTERNAL_GATEWAY_SECRET
          valueFrom: { secretKeyRef: { name: aml-secrets, key: INTERNAL_GATEWAY_SECRET } }
        - name: TURNSTILE_SECRET_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: TURNSTILE_SECRET_KEY, optional: true } }
        - name: KAFKA_SASL_USERNAME
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_USERNAME, optional: true } }
        - name: KAFKA_SASL_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_PASSWORD, optional: true } }
        - name: EVIDENCE_S3_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: EVIDENCE_S3_ACCESS_KEY, optional: true } }
        - name: EVIDENCE_S3_SECRET_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: EVIDENCE_S3_SECRET_KEY, optional: true } }
        - name: FINCEN_API_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: FINCEN_API_KEY, optional: true } }
        - name: SUPABASE_URL
          valueFrom: { secretKeyRef: { name: aml-secrets, key: SUPABASE_URL, optional: true } }
        - name: SUPABASE_KEY
          valueFrom: { secretKeyRef: { name: aml-secrets, key: SUPABASE_KEY, optional: true } }
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          timeoutSeconds: 3
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        # P0-01: Dedicated tmpfs mount so /tmp emptyDir never shadows PROMETHEUS_MULTIPROC_DIR
        - name: prom-multiproc
          mountPath: /tmp/prometheus_multiproc
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 256Mi
      - name: prom-multiproc
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aml-fastapi-service
  namespace: aml-system
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: aml-fastapi-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-fastapi-hpa
  namespace: aml-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-fastapi-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
