apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-fastapi-app
  namespace: aml-system
  labels:
    app: aml-fastapi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aml-fastapi-app
  template:
    metadata:
      labels:
        app: aml-fastapi-app
      annotations:
        # HashiCorp Vault Agent Injector Configuration
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "aml-api-role"
        vault.hashicorp.com/agent-inject-secret-ca.crt: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-ca.crt: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.issuing_ca }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.certificate }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-tls.key: "pki/issue/aml-cluster-role"
        vault.hashicorp.com/agent-inject-template-tls.key: |
          {{- with secret "pki/issue/aml-cluster-role" "common_name=aml-fastapi-app.aml-system.svc.cluster.local" -}}
          {{ .Data.private_key }}
          {{- end -}}
        vault.hashicorp.com/secret-volume-path-ca.crt: "/var/run/secrets/tls/ca.crt"
        vault.hashicorp.com/secret-volume-path-tls.crt: "/var/run/secrets/tls/tls.crt"
        vault.hashicorp.com/secret-volume-path-tls.key: "/var/run/secrets/tls/tls.key"
    spec:
      containers:
      - name: fastapi-app
        image: aml-fastapi-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        envFrom:
        - secretRef:
            name: aml-secrets
        - configMapRef:
            name: aml-config
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 5
        volumeMounts:
        - name: tls-certs
          mountPath: /var/run/secrets/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: aml-fastapi-service
  namespace: aml-system
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: aml-fastapi-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-fastapi-hpa
  namespace: aml-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-fastapi-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
