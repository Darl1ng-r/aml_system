# ════════════════════════════════════════════════════════════════════════════
# Kubernetes Secrets Definition Template for AML System
# ════════════════════════════════════════════════════════════════════════════
# This file provides a template for creating the aml-secrets Kubernetes Secret.
# Sensitive keys (JWT secret, Supabase credentials, DB passwords) are injected
# into application containers via envFrom.secretRef.
#
# Production Usage Options:
#   1. Imperative creation via CLI:
#        kubectl create secret generic aml-secrets \
#          --from-literal=POSTGRES_PASSWORD='production_pg_password' \
#          --from-literal=NEO4J_PASSWORD='production_neo4j_password' \
#          --from-literal=ELASTIC_PASSWORD='production_elastic_password' \
#          --from-literal=JWT_SECRET_KEY='production_256bit_jwt_secret' \
#          --from-literal=SUPABASE_KEY='your_production_supabase_anon_key' \
#          --from-literal=SUPABASE_URL='https://your_project.supabase.co' \
#          -n aml-system
#
#   2. Declarative apply with SealedSecrets / External Secrets Operator / Vault:
#        kubectl apply -f deployments/kubernetes/aml-secrets.yaml
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: aml-secrets
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-secrets
    app.kubernetes.io/part-of: aml-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgrespassword"
  NEO4J_PASSWORD: "passwordpassword"
  ELASTIC_PASSWORD: "changeme_in_production"
  JWT_SECRET_KEY: "change_me_in_production_jwt_secret_key_256bit"
  SUPABASE_KEY: "your_supabase_anon_key_here"
  SUPABASE_URL: "https://xzhsdffpnrlpcitiectz.supabase.co"
