# ════════════════════════════════════════════════════════════════════════════
# Kubernetes Secrets Definition Template for AML System
# ════════════════════════════════════════════════════════════════════════════
# This file provides a template for creating the aml-secrets Kubernetes Secret.
# Sensitive keys (RSA private keys, DB passwords, Redis credentials) are injected
# into application containers via envFrom.secretRef.
#
# Production Generation Instructions:
#   1. Generate 2048-bit RSA Private Key for JWT signing:
#        openssl genpkey -algorithm RSA -out jwt_private.pem -pkeyopt rsa_keygen_bits:2048
#
#   2. Imperative creation via CLI (Recommended):
#        kubectl create secret generic aml-secrets \
#          --from-file=JWT_PRIVATE_KEY_PEM=jwt_private.pem \
#          --from-literal=POSTGRES_PASSWORD='<PROD_PG_PASSWORD>' \
#          --from-literal=AML_APP_PASSWORD='<PROD_AML_APP_PASSWORD>' \
#          --from-literal=REDIS_PASSWORD='<PROD_REDIS_PASSWORD>' \
#          --from-literal=NEO4J_PASSWORD='<PROD_NEO4J_PASSWORD>' \
#          --from-literal=ELASTIC_PASSWORD='<PROD_ELASTIC_PASSWORD>' \
#          --from-literal=METRICS_SECRET='<PROD_METRICS_BEARER_TOKEN>' \
#          --from-literal=SUPABASE_KEY='<PROD_SUPABASE_ANON_KEY>' \
#          --from-literal=SUPABASE_URL='https://<PROJECT_REF>.supabase.co' \
#          -n aml-system
#
#   3. Declarative apply with SealedSecrets / External Secrets Operator:
#        Do NOT commit plaintext credentials to Git! Encrypt this manifest first.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: aml-secrets
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-secrets
    app.kubernetes.io/part-of: aml-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "" # Injected by ExternalSecrets / Vault
  AML_APP_PASSWORD: ""
  REDIS_PASSWORD: ""
  NEO4J_PASSWORD: ""
  ELASTIC_PASSWORD: ""
  JWT_PRIVATE_KEY_PEM: "" # Mandatory in production: 2048-bit RSA PEM
  METRICS_SECRET: ""
  SUPABASE_KEY: ""
  SUPABASE_URL: ""
