# ════════════════════════════════════════════════════════════════════════════
# ExternalSecret CRD Template for AML System (Zero Plaintext Secrets in Git)
# ════════════════════════════════════════════════════════════════════════════
# Syncs production credentials from HashiCorp Vault (via External Secrets Operator)
# into the cluster-local Kubernetes Secret `aml-secrets`.
# Never commit raw secret values to version control.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aml-secrets
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-secrets
    app.kubernetes.io/part-of: aml-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aml-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: aml-platform/database
      property: postgres_password
  - secretKey: AML_APP_PASSWORD
    remoteRef:
      key: aml-platform/database
      property: aml_app_password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: aml-platform/redis
      property: password
  - secretKey: NEO4J_PASSWORD
    remoteRef:
      key: aml-platform/neo4j
      property: password
  - secretKey: ELASTIC_PASSWORD
    remoteRef:
      key: aml-platform/elasticsearch
      property: password
  - secretKey: JWT_PRIVATE_KEY_PEM
    remoteRef:
      key: aml-platform/jwt
      property: rsa_private_key
  - secretKey: JWT_ALGORITHM
    remoteRef:
      key: aml-platform/jwt
      property: algorithm
  - secretKey: PII_ENCRYPTION_KEY
    remoteRef:
      key: aml-platform/encryption
      property: pii_key
  - secretKey: METRICS_SECRET
    remoteRef:
      key: aml-platform/observability
      property: metrics_secret
  - secretKey: INTERNAL_GATEWAY_SECRET
    remoteRef:
      key: aml-platform/gateway
      property: internal_secret
  - secretKey: SUPABASE_URL
    remoteRef:
      key: aml-platform/supabase
      property: url
  - secretKey: SUPABASE_KEY
    remoteRef:
      key: aml-platform/supabase
      property: anon_key
