# ════════════════════════════════════════════════════════════════════════════
# ExternalSecret CRD Template for AML System (Zero Plaintext Secrets in Git)
# Canonical KV-v2 paths aligned with services/vault_loader.py (aml/*) (P1-10)
# ════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aml-secrets
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-secrets
    app.kubernetes.io/part-of: aml-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aml-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: aml/postgres
      property: password
  - secretKey: AML_APP_PASSWORD
    remoteRef:
      key: aml/postgres
      property: aml_app_password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: aml/redis
      property: password
  - secretKey: NEO4J_PASSWORD
    remoteRef:
      key: aml/neo4j
      property: password
  - secretKey: ELASTIC_PASSWORD
    remoteRef:
      key: aml/elasticsearch
      property: password
  - secretKey: JWT_PRIVATE_KEY_PEM
    remoteRef:
      key: aml/jwt
      property: rsa_private_key
  - secretKey: JWT_PREVIOUS_PUBLIC_KEY_PEM
    remoteRef:
      key: aml/jwt
      property: previous_public_keys
  - secretKey: JWT_ALGORITHM
    remoteRef:
      key: aml/jwt
      property: algorithm
  - secretKey: PII_ENCRYPTION_KEY
    remoteRef:
      key: aml/encryption
      property: pii_key
  - secretKey: METRICS_SECRET
    remoteRef:
      key: aml/observability
      property: metrics_secret
  - secretKey: INTERNAL_GATEWAY_SECRET
    remoteRef:
      key: aml/gateway
      property: internal_secret
  - secretKey: TURNSTILE_SECRET_KEY
    remoteRef:
      key: aml/gateway
      property: turnstile_secret_key
  - secretKey: KAFKA_SASL_USERNAME
    remoteRef:
      key: aml/kafka
      property: sasl_username
  - secretKey: KAFKA_SASL_PASSWORD
    remoteRef:
      key: aml/kafka
      property: sasl_password
  - secretKey: EVIDENCE_S3_ACCESS_KEY
    remoteRef:
      key: aml/storage
      property: s3_access_key
  - secretKey: EVIDENCE_S3_SECRET_KEY
    remoteRef:
      key: aml/storage
      property: s3_secret_key
  - secretKey: FINCEN_API_KEY
    remoteRef:
      key: aml/fincen
      property: api_key
  - secretKey: SUPABASE_URL
    remoteRef:
      key: aml/supabase
      property: url
  - secretKey: SUPABASE_KEY
    remoteRef:
      key: aml/supabase
      property: key
