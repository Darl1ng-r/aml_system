apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aml-elasticsearch
  namespace: aml-system
  labels:
    app: aml-elasticsearch
spec:
  serviceName: aml-elasticsearch-service
  replicas: 3
  selector:
    matchLabels:
      app: aml-elasticsearch
  template:
    metadata:
      labels:
        app: aml-elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: elasticsearch:8.11.0
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: cluster.name
          value: aml-elasticsearch-cluster
        - name: discovery.seed_hosts
          value: "aml-elasticsearch-0.aml-elasticsearch-service,aml-elasticsearch-1.aml-elasticsearch-service,aml-elasticsearch-2.aml-elasticsearch-service"
        - name: cluster.initial_master_nodes
          value: "aml-elasticsearch-0,aml-elasticsearch-1,aml-elasticsearch-2"
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.transport.ssl.enabled
          value: "true"
        - name: xpack.security.transport.ssl.verification_mode
          value: "certificate"
        - name: xpack.security.transport.ssl.key
          value: "/usr/share/elasticsearch/config/tls/tls.key"
        - name: xpack.security.transport.ssl.certificate
          value: "/usr/share/elasticsearch/config/tls/tls.crt"
        - name: xpack.security.transport.ssl.certificate_authorities
          value: "/usr/share/elasticsearch/config/tls/ca.crt"
        - name: xpack.security.http.ssl.enabled
          value: "true"
        - name: xpack.security.http.ssl.key
          value: "/usr/share/elasticsearch/config/tls/tls.key"
        - name: xpack.security.http.ssl.certificate
          value: "/usr/share/elasticsearch/config/tls/tls.crt"
        - name: xpack.security.http.ssl.certificate_authorities
          value: "/usr/share/elasticsearch/config/tls/ca.crt"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: ELASTIC_PASSWORD
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        - name: tls-certs
          mountPath: /usr/share/elasticsearch/config/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aml-elasticsearch-service
  namespace: aml-system
  labels:
    app: aml-elasticsearch
spec:
  clusterIP: None
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: aml-elasticsearch
