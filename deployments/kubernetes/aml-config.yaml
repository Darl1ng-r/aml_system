# ════════════════════════════════════════════════════════════════════════════
# Kubernetes ConfigMap for AML System Platform
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: aml-config
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-config
    app.kubernetes.io/part-of: aml-platform
data:
  ENVIRONMENT: "production"
  ALLOWED_ORIGINS: "https://aml.yourdomain.com"
  ENABLE_TLS: "true"
  STRICT_MTLS: "true"
  POSTGRES_HOST: "aml-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aml_db"
  POSTGRES_USER: "aml_app"
  REDIS_HOST: "aml-redis"
  REDIS_PORT: "6379"
  NEO4J_URI: "bolt://aml-neo4j:7687"
  NEO4J_USER: "neo4j"
  ELASTICSEARCH_HOST: "http://aml-elasticsearch:9200"
  KAFKA_BOOTSTRAP_SERVERS: "aml-redpanda:9092"
  TRANSACTIONS_TOPIC: "aml.transactions.scored"
