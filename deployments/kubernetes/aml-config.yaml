# ════════════════════════════════════════════════════════════════════════════
# Kubernetes ConfigMap for AML System Platform
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: aml-config
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-config
    app.kubernetes.io/part-of: aml-platform
data:
  ENVIRONMENT: "production"
  ALLOW_PUBLIC_SIGNUP: "false"
  ALLOWED_ORIGINS: "https://aml.yourdomain.com"
  ENABLE_TLS: "true"
  STRICT_MTLS: "true"
  WEB_CONCURRENCY: "2"
  RUN_EMBEDDED_WORKER: "false"
  # Datastore Consolidation (PostgreSQL pg_trgm + recursive CTEs as primary)
  ENABLE_NEO4J: "false"
  ENABLE_ELASTICSEARCH: "false"
  # Corrected Kubernetes Service DNS Names
  POSTGRES_HOST: "aml-pgbouncer-service"
  POSTGRES_PORT: "6432"
  PGBOUNCER_ENABLED: "true"
  POSTGRES_REPLICA_HOST: "aml-postgres-replica"
  POSTGRES_REPLICA_PORT: "5432"
  POSTGRES_DB: "aml_db"
  POSTGRES_USER: "aml_app"
  REDIS_HOST: "aml-redis-service"
  REDIS_PORT: "6379"
  NEO4J_URI: "bolt://aml-neo4j-service:7687"
  NEO4J_USER: "neo4j"
  ELASTICSEARCH_HOST: "https://aml-elasticsearch-service:9200"
  KAFKA_BOOTSTRAP_SERVERS: "aml-redpanda-service:9092"
  TRANSACTIONS_TOPIC: "aml.transactions.scored"
  OTEL_EXPORTER_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
