# ════════════════════════════════════════════════════════════════════════════
# Redis StatefulSet (Auth Revocations, Distributed Locks & Hot Cache)
# ════════════════════════════════════════════════════════════════════════════
# Converted from Deployment+RWO PVC to StatefulSet to prevent rolling-update
# Multi-Attach volume deadlocks. Enforces --requirepass and noeviction policy.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aml-redis
  namespace: aml-system
  labels:
    app: aml-redis
spec:
  serviceName: aml-redis-service
  replicas: 1
  selector:
    matchLabels:
      app: aml-redis
  template:
    metadata:
      labels:
        app: aml-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: REDIS_PASSWORD
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: aml-secrets
              key: REDIS_PASSWORD
        command:
        - sh
        - -c
        - >
          exec redis-server
          --appendonly yes
          --maxmemory 384mb
          --maxmemory-policy noeviction
          --requirepass "$REDIS_PASSWORD"
        ports:
        - containerPort: 6379
          name: redisport
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "256Mi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aml-redis-service
  namespace: aml-system
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: aml-redis
