apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-redis
  namespace: aml-system
  labels:
    app: aml-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aml-redis
  template:
    metadata:
      labels:
        app: aml-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
          name: redisport
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: aml-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aml-redis-pvc
  namespace: aml-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aml-redis-service
  namespace: aml-system
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: aml-redis
