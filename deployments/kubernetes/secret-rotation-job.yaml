# ════════════════════════════════════════════════════════════════════════════
# Kubernetes Secret Rotation CronJob
# ════════════════════════════════════════════════════════════════════════════
# Automatically rotates the JWT active signing key on a scheduled basis
# while keeping the previous key in JWT_SECRET_KEYS for seamless verification.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aml-secret-rotation-cron
  namespace: aml-system
spec:
  schedule: "0 0 1 * *" # First day of every month at midnight
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: aml-secret-rotator
          restartPolicy: OnFailure
          containers:
          - name: rotator
            image: bitnami/kubectl:latest
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Starting scheduled JWT secret rotation..."

              # 1. Fetch current secret from aml-secrets
              OLD_KEY=$(kubectl get secret aml-secrets -n aml-system -o jsonpath='{.data.JWT_SECRET_KEY}' | base64 --decode)

              # 2. Generate new random 256-bit key
              NEW_KEY=$(openssl rand -hex 32)

              # 3. Combine into multi-key rotation format (new_key,old_key)
              ROTATED_KEYS="${NEW_KEY},${OLD_KEY}"

              # 4. Patch secret with new primary key and rotation fallbacks
              kubectl patch secret aml-secrets -n aml-system \
                --type=json -p="[
                  {\"op\": \"replace\", \"path\": \"/data/JWT_SECRET_KEY\", \"value\":\"$(echo -n $NEW_KEY | base64)\"},
                  {\"op\": \"add\", \"path\": \"/data/JWT_SECRET_KEYS\", \"value\":\"$(echo -n $ROTATED_KEYS | base64)\"}
                ]"

              echo "Secret rotation complete! Pods will perform hot-reloading without token invalidation."
