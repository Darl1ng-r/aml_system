# ════════════════════════════════════════════════════════════════════════════
# Kubernetes Zero-Downtime RS256 Key Rotation RBAC + CronJob (Fixes P1-07)
# ============================================================================
# Rotates RS256 keys inside HashiCorp Vault (source of truth for ExternalSecret),
# preserving the previous public key in `previous_public_keys` for zero-downtime
# JWKS grace verification. Never passes key material on CLI argv; uses tmpfs.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aml-secret-rotator
  namespace: aml-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aml-secret-rotator-role
  namespace: aml-system
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["aml-fastapi-app"]
  verbs: ["get", "patch", "watch"]
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets"]
  resourceNames: ["aml-secrets"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aml-secret-rotator-binding
  namespace: aml-system
subjects:
- kind: ServiceAccount
  name: aml-secret-rotator
  namespace: aml-system
roleRef:
  kind: Role
  name: aml-secret-rotator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aml-secret-rotation-cron
  namespace: aml-system
spec:
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: aml-secret-rotator
        spec:
          serviceAccountName: aml-secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: rotator
            image: alpine/k8s:1.29.10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
                ephemeral-storage: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
                ephemeral-storage: "128Mi"
            env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_K8S_ROLE
              value: "aml-rotator-role"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            command:
            - /bin/sh
            - -eu
            - -c
            - |
              umask 077
              echo "Starting zero-downtime Vault-backed RS256 JWT rotation..."

              # 1. Authenticate to Vault via Kubernetes ServiceAccount JWT (no key material on argv)
              SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              jq -n --arg jwt "$SA_JWT" --arg role "$VAULT_K8S_ROLE" '{jwt:$jwt, role:$role}' > /tmp/login.json
              VAULT_TOKEN=$(curl -fsS --request POST --data @/tmp/login.json \
                "${VAULT_ADDR}/v1/auth/kubernetes/login" | jq -r '.auth.client_token')
              rm -f /tmp/login.json

              # 2. Fetch existing active private key and derive its public key for grace window
              curl -fsS -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/secret/data/aml/jwt" > /tmp/current_jwt.json
              jq -r '.data.data.rsa_private_key // empty' /tmp/current_jwt.json > /tmp/old_priv.pem
              OLD_PUB=""
              if [ -s /tmp/old_priv.pem ]; then
                openssl pkey -in /tmp/old_priv.pem -pubout -out /tmp/old_pub.pem
                OLD_PUB=$(cat /tmp/old_pub.pem)
              fi

              # 3. Generate fresh 2048-bit RSA keypair inside tmpfs (/tmp)
              openssl genpkey -algorithm RSA -out /tmp/new_priv.pem -pkeyopt rsa_keygen_bits:2048
              NEW_PRIV=$(cat /tmp/new_priv.pem)

              # 4. Write atomically to Vault KV-v2 via request body file (never CLI args)
              jq -n \
                --arg priv "$NEW_PRIV" \
                --arg prev "$OLD_PUB" \
                '{data:{algorithm:"RS256", rsa_private_key:$priv, previous_public_keys:$prev}}' \
                > /tmp/vault_payload.json
              curl -fsS -H "X-Vault-Token: ${VAULT_TOKEN}" \
                --request POST --data @/tmp/vault_payload.json \
                "${VAULT_ADDR}/v1/secret/data/aml/jwt" > /dev/null

              rm -f /tmp/current_jwt.json /tmp/old_priv.pem /tmp/old_pub.pem /tmp/new_priv.pem /tmp/vault_payload.json

              # 5. Force immediate ExternalSecret sync + zero-downtime rolling restart
              kubectl annotate externalsecret aml-secrets -n aml-system \
                force-sync="$(date +%s)" --overwrite
              kubectl rollout restart deployment/aml-fastapi-app -n aml-system
              kubectl rollout status deployment/aml-fastapi-app -n aml-system --timeout=180s

              echo "Zero-downtime RS256 rotation completed (previous public key retained in JWKS)."
          volumes:
          - name: tmp
            emptyDir:
              # Memory-backed tmpfs prevents private key material from ever touching node disk
              medium: Memory
              sizeLimit: 16Mi
