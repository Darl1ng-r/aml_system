# ════════════════════════════════════════════════════════════════════════════
# Kubernetes Secret Rotation RBAC + CronJob (RS256 Asymmetric Key Rotation)
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aml-secret-rotator
  namespace: aml-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aml-secret-rotator-role
  namespace: aml-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["aml-secrets"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["aml-fastapi-app"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aml-secret-rotator-binding
  namespace: aml-system
subjects:
- kind: ServiceAccount
  name: aml-secret-rotator
  namespace: aml-system
roleRef:
  kind: Role
  name: aml-secret-rotator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aml-secret-rotation-cron
  namespace: aml-system
spec:
  schedule: "0 0 1 * *" # First day of every month at 00:00 UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: aml-secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: rotator
            # alpine/k8s includes both openssl and kubectl
            image: alpine/k8s:1.29.10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
                ephemeral-storage: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
                ephemeral-storage: "128Mi"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "Starting scheduled RS256 JWT keypair rotation..."

              # 1. Generate fresh 2048-bit RSA private key in /tmp
              openssl genpkey -algorithm RSA -out /tmp/jwt_private.pem -pkeyopt rsa_keygen_bits:2048

              # 2. Single-line base64 encoding (no embedded newlines that break JSON patch)
              NEW_PEM_B64=$(base64 < /tmp/jwt_private.pem | tr -d '\n')
              rm -f /tmp/jwt_private.pem

              # 3. Patch aml-secrets with the new RSA private key
              kubectl patch secret aml-secrets -n aml-system \
                --type=json \
                -p="[{\"op\": \"replace\", \"path\": \"/data/JWT_PRIVATE_KEY_PEM\", \"value\": \"${NEW_PEM_B64}\"}]"

              # 4. Perform zero-downtime rolling restart so pods pick up rotated key
              kubectl rollout restart deployment/aml-fastapi-app -n aml-system
              kubectl rollout status deployment/aml-fastapi-app -n aml-system --timeout=180s

              echo "RS256 keypair rotation and rolling restart complete."
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 16Mi
