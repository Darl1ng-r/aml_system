# ════════════════════════════════════════════════════════════════════════════
# Dedicated Asynchronous AML Scoring Worker Deployment (V-01)
# Hardened: tmpfs prom-multiproc, TLS cert mount, heartbeat probe, least-priv secrets
# ════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-scoring-worker
  namespace: aml-system
  labels:
    app: aml-scoring-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aml-scoring-worker
  template:
    metadata:
      labels:
        app: aml-scoring-worker
    spec:
      serviceAccountName: aml-fastapi-sa
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aml-scoring-worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aml-scoring-worker
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scoring-worker
        image: ghcr.io/aml-sentinel/aml-fastapi-app:${IMAGE_TAG}
        imagePullPolicy: Always
        command: ["python", "-m", "workers.scoring_worker"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: aml-config
        env:
        - name: AML_APP_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: AML_APP_PASSWORD } }
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: REDIS_PASSWORD } }
        - name: KAFKA_SASL_USERNAME
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_USERNAME, optional: true } }
        - name: KAFKA_SASL_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_PASSWORD, optional: true } }
        livenessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/scoring_worker.hb && [ $(($(date +%s) - $(cat /tmp/scoring_worker.hb))) -lt 60 ]"]
          initialDelaySeconds: 25
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
            ephemeral-storage: "256Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: prom-multiproc
          mountPath: /tmp/prometheus_multiproc
        - name: tls-certs
          mountPath: /var/run/secrets/tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: prom-multiproc
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
