---
# =====================================================================
# AML System — Kubernetes Network Policies
# =====================================================================
# These policies implement a default-deny-all posture, then
# explicitly allow only the connections required by each service.
#
# Topology allowed after applying all policies:
#
#   Internet → [Ingress] → FastAPI
#   FastAPI  → PostgreSQL, Neo4j, Redis, Elasticsearch, Redpanda
#   Nothing  → FastAPI (except Ingress)
#   Nothing  → backing stores directly from outside the namespace
# =====================================================================

# Policy 1: Default deny all ingress + egress for every pod in namespace.
# All specific allow rules below add on top of this baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aml-system
spec:
  podSelector: {}      # matches ALL pods in the namespace
  policyTypes:
  - Ingress
  - Egress

---
# Policy 2: Allow ingress controller → FastAPI (port 8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-fastapi
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-fastapi-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx  # ingress controller namespace
    ports:
    - protocol: TCP
      port: 8000

---
# Policy 3: Allow FastAPI → PostgreSQL (port 5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-postgres
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 5432

---
# Policy 4: Allow FastAPI → Neo4j (Bolt 7687, HTTP 7474)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-neo4j
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-neo4j
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7474

---
# Policy 5: Allow FastAPI → Redis (port 6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-redis
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 6379

---
# Policy 6: Allow FastAPI → Elasticsearch (port 9200)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-elasticsearch
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-elasticsearch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 9200

---
# Policy 7: Allow FastAPI → Redpanda Kafka API (port 9092)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-redpanda
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-redpanda
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 9092

---
# Policy 8: Allow FastAPI egress to all backing stores and DNS
# Without this, outbound connections from FastAPI pods are blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-egress
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-fastapi-app
  policyTypes:
  - Egress
  egress:
  # DNS resolution (kube-dns)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432
  # Neo4j
  - to:
    - podSelector:
        matchLabels:
          app: aml-neo4j
    ports:
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7474
  # Redis
  - to:
    - podSelector:
        matchLabels:
          app: aml-redis
    ports:
    - protocol: TCP
      port: 6379
  # Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app: aml-elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # Redpanda
  - to:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 9092
  # Supabase auth (external HTTPS)
  - ports:
    - protocol: TCP
      port: 443
