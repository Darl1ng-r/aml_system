  - to: [{ podSelector: { matchLabels: { app: aml-postgres-replica } } }]
    ports: [{ protocol: TCP, port: 5432 }]
  - to: [{ podSelector: { matchLabels: { app: aml-pgbouncer } } }]
    ports: [{ protocol: TCP, port: 6432 }]
  - to: [{ podSelector: { matchLabels: { app: aml-redpanda } } }]
    ports: [{ protocol: TCP, port: 9092 }, { protocol: TCP, port: 9093 }]
  - to: [{ podSelector: { matchLabels: { app: aml-redis } } }]
