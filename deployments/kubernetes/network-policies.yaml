    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  - to: [{ podSelector: { matchLabels: { app: aml-pgbouncer } } }]
    ports: [{ protocol: TCP, port: 6432 }]
  - to: [{ podSelector: { matchLabels: { app: aml-postgres } } }]
    ports: [{ protocol: TCP, port: 5432 }]
  - to: [{ podSelector: { matchLabels: { app: aml-postgres-replica } } }]
    ports: [{ protocol: TCP, port: 5432 }]
  - to: [{ podSelector: { matchLabels: { app: aml-neo4j } } }]
    ports: [{ protocol: TCP, port: 7687 }, { protocol: TCP, port: 7474 }]
  - to: [{ podSelector: { matchLabels: { app: aml-redis } } }]
    ports: [{ protocol: TCP, port: 6379 }]
  - to: [{ podSelector: { matchLabels: { app: aml-redis-cache } } }]
    ports: [{ protocol: TCP, port: 6379 }]
  - to: [{ podSelector: { matchLabels: { app: aml-redpanda } } }]
    ports: [{ protocol: TCP, port: 9092 }, { protocol: TCP, port: 9093 }]
  - to:
