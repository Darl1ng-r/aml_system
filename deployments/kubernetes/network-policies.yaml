---
# =====================================================================
# AML System — Kubernetes Network Policies
# =====================================================================
# These policies implement a default-deny-all posture, then
# explicitly allow only the connections required by each service.
#
# Topology allowed after applying all policies:
#
#   Internet → [Ingress] → FastAPI
#   FastAPI  → PostgreSQL, Neo4j, Redis, Elasticsearch, Redpanda
#   Nothing  → FastAPI (except Ingress)
#   Nothing  → backing stores directly from outside the namespace
# =====================================================================

# Policy 1: Default deny all ingress + egress for every pod in namespace.
# All specific allow rules below add on top of this baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aml-system
spec:
  podSelector: {}      # matches ALL pods in the namespace
  policyTypes:
  - Ingress
  - Egress

---
# Policy 2: Allow ingress controller & Prometheus scraper → FastAPI (port 8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-fastapi
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-fastapi-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000

---
# Policy 2b: Allow FastAPI, Outbox Relay & Sync Worker → PgBouncer (port 6432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-pgbouncer
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-pgbouncer
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    - podSelector:
        matchLabels:
          app: aml-outbox-relay
    - podSelector:
        matchLabels:
          app: aml-sync-worker
    ports:
    - protocol: TCP
      port: 6432
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432

---
# Policy 3: Allow PgBouncer, FastAPI, Workers, Migrations & Postgres Replication → PostgreSQL (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-postgres
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-pgbouncer
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    - podSelector:
        matchLabels:
          app: aml-sync-worker
    - podSelector:
        matchLabels:
          app: aml-outbox-relay
    - podSelector:
        matchLabels:
          job: aml-db-migrations
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # DNS + Primary <-> Replica streaming WAL replication
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432

---
# Policy 4: Allow FastAPI & Sync Worker → Neo4j (Bolt 7687, HTTP 7474)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-neo4j
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-neo4j
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    - podSelector:
        matchLabels:
          app: aml-sync-worker
    ports:
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7474

---
# Policy 5: Allow FastAPI & Sync Worker → Redis (port 6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-redis
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    - podSelector:
        matchLabels:
          app: aml-sync-worker
    ports:
    - protocol: TCP
      port: 6379

---
# Policy 6: Allow FastAPI → Elasticsearch (port 9200)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-elasticsearch
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-elasticsearch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    ports:
    - protocol: TCP
      port: 9200

---
# Policy 7: Allow FastAPI & Sync Worker → Redpanda Kafka API (port 9092)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-redpanda
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-redpanda
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-fastapi-app
    - podSelector:
        matchLabels:
          app: aml-sync-worker
    ports:
    - protocol: TCP
      port: 9092

---
# Policy 8: Allow FastAPI egress to all backing stores and DNS
# Without this, outbound connections from FastAPI pods are blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-egress
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-fastapi-app
  policyTypes:
  - Egress
  egress:
  # DNS resolution (kube-dns)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # PgBouncer
  - to:
    - podSelector:
        matchLabels:
          app: aml-pgbouncer
    ports:
    - protocol: TCP
      port: 6432
  # PostgreSQL (read replica / direct)
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432
  # Neo4j
  - to:
    - podSelector:
        matchLabels:
          app: aml-neo4j
    ports:
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7474
  # Redis
  - to:
    - podSelector:
        matchLabels:
          app: aml-redis
    ports:
    - protocol: TCP
      port: 6379
  # Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app: aml-elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # Redpanda
  - to:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 9092
  # HashiCorp Vault (8200) & OpenTelemetry Collector (4317)
  - ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 4317
  # External HTTPS (Supabase / HIBP / Watchlists / SIEM)
  - ports:
    - protocol: TCP
      port: 443

---
# Policy 9: Allow Sync Worker egress to Redpanda, Postgres, Neo4j, Redis, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sync-worker-egress
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-sync-worker
  policyTypes:
  - Egress
  egress:
  # DNS resolution (kube-dns)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432
  # Neo4j
  - to:
    - podSelector:
        matchLabels:
          app: aml-neo4j
    ports:
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7474
  # Redis (for WebSocket event broadcast)
  - to:
    - podSelector:
        matchLabels:
          app: aml-redis
    ports:
    - protocol: TCP
      port: 6379
  # Redpanda
  - to:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 9092

---
# Policy 10: Allow Outbox Relay Worker egress (Postgres, PgBouncer, Redpanda, Redis, OTel, Vault, DNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-outbox-relay-egress
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-outbox-relay
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: aml-pgbouncer
    ports:
    - protocol: TCP
      port: 6432
  - to:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchLabels:
          app: aml-redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 4317

---
# Policy 11: Allow Alembic DB Migration Job egress to PostgreSQL (5432) & DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-migrations-egress
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      job: aml-db-migrations
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-postgres
    ports:
    - protocol: TCP
      port: 5432

---
# Policy 12: Allow Elasticsearch inter-node transport (9300) & Redpanda Raft (33145) + Outbox Relay → Redpanda
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-es-and-redpanda-cluster-mesh
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-redpanda
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-outbox-relay
    ports:
    - protocol: TCP
      port: 9092
  - from:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 33145
    - protocol: TCP
      port: 9092
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-redpanda
    ports:
    - protocol: TCP
      port: 33145
    - protocol: TCP
      port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-internode
  namespace: aml-system
spec:
  podSelector:
    matchLabels:
      app: aml-elasticsearch
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aml-elasticsearch
    ports:
    - protocol: TCP
      port: 9300
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: aml-elasticsearch
    ports:
    - protocol: TCP
      port: 9300
