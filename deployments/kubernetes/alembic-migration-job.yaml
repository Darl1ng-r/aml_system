apiVersion: batch/v1
kind: Job
metadata:
  name: aml-alembic-migration
  namespace: aml-system
  labels:
    app.kubernetes.io/name: aml-migration
    app.kubernetes.io/part-of: aml-platform
  annotations:
    # Runs as a pre-sync hook in GitOps (ArgoCD) or Helm pre-upgrade hook
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: aml-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: alembic-migrator
        image: aml-fastapi-app:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        command: ["alembic", "upgrade", "head"]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
            ephemeral-storage: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "256Mi"
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: aml-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: aml-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: aml-config
              key: POSTGRES_DB
        envFrom:
        - secretRef:
            name: aml-secrets
