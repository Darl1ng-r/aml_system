apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-sync-worker
  namespace: aml-system
  labels:
    app: aml-sync-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aml-sync-worker
  template:
    metadata:
      labels:
        app: aml-sync-worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "aml-api-role"
    spec:
      serviceAccountName: aml-fastapi-sa
      # Required when vault.hashicorp.com/agent-inject is enabled (P1-10)
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sync-worker
        image: ghcr.io/aml-sentinel/aml-fastapi-app:${IMAGE_TAG}
        imagePullPolicy: Always
        command: ["python", "scripts/sync_worker.py"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"
            ephemeral-storage: "512Mi"
        envFrom:
        - configMapRef:
            name: aml-config
        env:
        - name: RUN_EMBEDDED_WORKER
          value: "false"
        - name: AML_APP_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: AML_APP_PASSWORD } }
        - name: NEO4J_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: NEO4J_PASSWORD } }
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: REDIS_PASSWORD } }
        - name: KAFKA_SASL_USERNAME
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_USERNAME, optional: true } }
        - name: KAFKA_SASL_PASSWORD
          valueFrom: { secretKeyRef: { name: aml-secrets, key: KAFKA_SASL_PASSWORD, optional: true } }
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: prom-multiproc
          mountPath: /tmp/prometheus_multiproc
        - name: tls-certs
          mountPath: /var/run/secrets/tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: prom-multiproc
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: tls-certs
        secret:
          secretName: aml-internal-services-tls-secret
